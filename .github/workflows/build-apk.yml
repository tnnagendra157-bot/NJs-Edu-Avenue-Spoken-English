name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q NJs_Edu_Avenue_Spoken_English_Android_Project_v3.zip -d project
          PROJECT_DIR=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Apply build compatibility fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/njseduavenue/spokenenglish/MainActivity.kt')
          s = p.read_text()
          old = '''        if (showSplash) {\n            SplashScreen()\n            return@MaterialTheme\n        }\n        Scaffold('''
          new = '''        if (showSplash) {\n            SplashScreen()\n        } else {\n        Scaffold('''
          if old not in s:
              raise SystemExit('Expected App() splash block was not found')
          s = s.replace(old, new, 1)
          marker = '''        }\n    }\n}\n\n@Composable\nfun SplashScreen()'''
          replacement = '''        }\n        }\n    }\n}\n\n@Composable\nfun SplashScreen()'''
          if marker not in s:
              raise SystemExit('Expected App() closing block was not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and capture log
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NJs-Edu-Avenue-Build-Log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NJs-Edu-Avenue-Spoken-English-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
